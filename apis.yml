name: Belvedir
description: >-
  Belvedir is an autonomous private AI platform built by Fractal Machine
  Research, Inc. (a Y Combinator Summer 2026 company). It lets individuals and
  teams train custom AI models and memory systems, host them privately on
  single-tenant infrastructure, and continually improve them through use: it
  collects agent calls and production traces, converts those traces into
  training data, and fine-tunes models with reinforcement learning in a
  continuous loop before redeploying on private infrastructure. The stated aim
  is to let everyday individuals own their own artificial intelligence rather
  than rent it from a shared provider. The product is in closed alpha and access
  is currently granted by request; there is no public API or developer
  documentation yet, so this profile captures the company's public identity and
  will be enriched as a developer surface appears.
